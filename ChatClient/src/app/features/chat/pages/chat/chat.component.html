<div class="chat-shell" [class.mobile-conversation-open]="showConversationOnMobile()">
  <app-chat-sidebar
    [currentUserId]="authService.currentUser()?.userId ?? null"
    [conversations]="conversations()"
    [conversationsLoading]="conversationsLoading()"
    [conversationsError]="conversationsError()"
    [openingConversation]="openingConversation()"
    (retryConversations)="retryConversations()"
    [selectedFriend]="selectedFriend()"
    [selectedConversationId]="selectedConversationId()"
    (friendSelected)="openConversation($event)"
    (conversationSelected)="openExistingConversation($event)"
    (messageResultSelected)="openMessageResult($event)"
  />
  <app-chat-conversation
    [friend]="selectedFriend()"
    [conversationId]="selectedConversationId()"
    [conversationActive]="showConversationOnMobile()"
    [messages]="messages()"
    [initialLoading]="initialLoading()"
    [loadingOlder]="loadingOlder()"
    [historyError]="historyError()"
    [navigationNotice]="navigationNotice()"
    [highlightedMessageId]="selectedMessageId()"
    [highlightRequestVersion]="messageNavigationVersion()"
    (searchNavigationFailed)="handleSearchNavigationFailed($event)"
    [hasMore]="hasMore()"
    [olderPageVersion]="olderPageVersion()"
    [connectionStatus]="chatService.status()"
    [connectionError]="chatService.error()"
    [sending]="sending()"
    [sendResult]="sendResult()"
    [currentUserId]="authService.currentUser()?.userId ?? null"
    [currentUsername]="authService.currentUser()?.username ?? ''"
    [typingUsername]="typingUsername()"
    (typingStarted)="handleTypingStarted($event)"
    (typingStopped)="handleTypingStopped($event)"
    (readAcknowledged)="acknowledgeRead($event)"
    (messageSubmitted)="sendMessage($event)"
    (loadOlder)="loadOlderMessages()"
    (retryHistory)="retryCurrentConversation()"
    (retryConnection)="connect()"
    (backToList)="showConversationListOnMobile()"
  />
</div>
